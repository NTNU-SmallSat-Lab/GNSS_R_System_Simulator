[SIMULATION SETTINGS]
startTime = 02.04.2025 12:00:00
stepSize = 30
simulationDuration = 24

[COVERAGE]
shapefile_path = data/International_hydrographic_organization/iho_norwegian_coast.shp
grid_size_meters = 30_000

[ANTENNA PATTERN]
elements_along_x    = 3
elements_along_y    = 4
d_x                 = 0.1
d_y                 = 0.1
freqs               = [1176.45, 1575.42]
elevation_directivity = [0, 20, 5]
azimuth_directivity   = [0, 358, 5]
elevation_resolution  = 180
azimuth_resolution    = 360

[ANTENNA]
; This folder is generator-owned when [ANTENNA PATTERN] is present.
; Keep only pattern files produced for the current antenna configuration here.
pattern_folder = data/ANTENNA/antenna_patterns_area
max_steering_angle_deg = [0, 40]
polarizations = ["RHCP", "LHCP"]
bands = ["L1"]
; Footprint contour in dB relative to the normalized pattern peak.
footprint_db = -1.0

[ORBITS] ;Inclination, Eccentricity, RAAN, Argument of Perigee, Mean Anomaly, Semi-Major Axis
;Follower group 1
;orbit1 = [97.4036, 0.0018041, 33.4951, 60.1062, 298.5990, 6881e3] #Celeste follower orbit
;orbit2 = [97.4024, 0.0015572, 33.4989, 53.8372, 305.0983, 6881e3] #Celeste test orbit
orbit1 = [97.4048, 0.0020455, 30.4913, 56, 302, 6881e3] #Celeste test orbit
;orbit4 = [97.4050, 0.0018244, 30.4970, 50.5000, 308.0000, 6881e3] #Celeste test orbit
;Follower group 2


;orbit1 = [97.4050, 0.0018244, 130, 113, 290, 6881e3]



[GNSS CONSTELLATIONS]
gnss_tle_files = [CELESTE_TEST.tle]

[LINK BUDGET]
; Simple first-order model:
;   sigma = sigma0(theta_i) * A_fresnel * fresnel_rcs_scale
; `ocean_sigma*` values are effective calibration parameters in this model
; (not a full coherent/diffuse ocean scattering model).
tx_eirp_dbw = 27.0
system_losses_db = 2.0
polarization_losses_db = 0.5
ocean_sigma0_db = -20.0
ocean_sigma_slope_db_per_deg = 0.25
ocean_sigma_floor_db = -45.0
fresnel_rcs_scale = 1.0
