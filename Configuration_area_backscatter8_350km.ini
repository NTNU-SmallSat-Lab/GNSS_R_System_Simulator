[SIMULATION SETTINGS]
;DD:MM:YYYY HH:mm:ss
startTime = 03.06.2026 12:00:00
stepSize = 30
simulationDuration = 24

[COVERAGE]
shapefile_path = data/International_hydrographic_organization/iho_norwegian_coast.shp
grid_size_meters = 30_000

[ANTENNA PATTERN]
; Steered beam for corner-reflector backscatter
; Include both nadir (0°) for footprint and steered (40°) for optimized coverage
elements_along_x    = 3
elements_along_y    = 4
d_x                 = 0.1
d_y                 = 0.1
freqs               = [1176.45, 1575.42]
elevation_directivity = [0, 50, 5]
azimuth_directivity   = [0, 20, 5]
elevation_resolution  = 180
azimuth_resolution    = 360

[ANTENNA]
pattern_folder = data/ANTENNA/antenna_patterns_area
max_steering_angle_deg = [0, 40]
polarizations = ["RHCP", "LHCP"]
bands = ["L1"]
footprint_db = -1.0

[ORBITS]
; 1 Rx satellite from CELESTE_IOD3.tle, 350 km (2.889 deg) behind Tx
; MA_config = 247.83 deg (250.717 - 2.889 = 247.828 deg)
no_satellites = 1
orbit1 = [97.4, 0.0011314, 0.0, 250.717, 2.89, 6939643]

[GNSS CONSTELLATIONS]
gnss_tle_files = [CELESTE_IOD3.tle]

[REFLECTION]
reflection_type = "backscatter"
cutoff_angle = 90
min_tx_elevation_deg = 30.0
max_bistatic_angle_deg = 10.0

[LINK BUDGET]
tx_eirp_dbw = 27.0
system_losses_db = 2.0
polarization_losses_db = 0.5
ocean_sigma0_db = -20.0
ocean_sigma_slope_db_per_deg = 0.25
ocean_sigma_floor_db = -45.0
fresnel_rcs_scale = 1.0
