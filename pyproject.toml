[build-system]
requires = ["setuptools>=77", "wheel"]  # >=77 for the SPDX string form of project.license
build-backend = "setuptools.build_meta"

[project]
name = "gnss-r-simulator"
version = "1.0.0"
description = "GNSS-R Simulator for marine vessel detection"
authors = [
    {name = "Oliver Hasler", email = "oliver.hasler@ntnu.no"},
    {name = "Corrado Chiatante", email = "corrado.chiatante@ntnu.no"},
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12.3"  # Updated for Black compatibility
dependencies = [
    # Core scientific computing
    "numpy>=2.0.2",
    "pandas>=2.2.3",
    "scipy>=1.14.1",
    "matplotlib>=3.10.1",
    # Pinned >=2.9.0 to silence the utcfromtimestamp DeprecationWarning fixed in that release.
    # Pulled in transitively by pandas/matplotlib.
    "python-dateutil>=2.9.0",
    
    # Space science and astronomy
    # pymap3d uses astropy for ECI<->ECEF transforms. functions.py also
    # configures the IERS offline fallback explicitly.
    "astropy>=6.1.6",
    "astropy-iers-data>=0.2024.11.0",
    "skyfield>=1.49",
    "sgp4>=2.23",

    # Geospatial and mapping
    "cartopy>=0.24.1",
    "geopandas>=1.0.1",
    "pyproj>=3.7.0",
    "shapely>=2.0.6",
    "pymap3d>=3.1.0",
    "pyogrio>=0.10.0",

    # Graph algorithms and path planning
    "networkx>=3.4.2",  # Added for ship trajectory path planning

    # Engine settings file (simulator_settings.yaml)
    "PyYAML>=6.0.2",

    # Performance and utilities
    "imageio>=2.37.0",
    "pillow>=10.4.0",
    "tqdm>=4.67.1",

    # Interactive 3D plotting (rotatable standalone HTML orbit view)
    "plotly>=5.24.0",

    # GUI (if needed)
    "PyQt5>=5.15.11",
]

[project.optional-dependencies]
# Code formatting and development tools only
dev = [
    "black>=25.1.0",  # Latest version compatible with Python 3.12.6
    "ruff>=0.8.2",
    "mypy>=1.13.0",
    "pytest>=8.0",
]
# Documentation toolchain (Sphinx, Basilisk-style per-module .rst; build with `cd docs && make html`)
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "myst-parser>=2.0",
]

[project.urls]
Repository = "https://github.com/NTNU-SmallSat-Lab/GNSS_R_System_Simulator.git"
Documentation = "https://ntnu-smallsat-lab.github.io/GNSS_R_System_Simulator/"

[tool.setuptools]
# The simulator runs from the repository root with SRC/ on sys.path, not as an installed package;
# installing the project only pulls in its dependencies.
packages = []

# Code formatting and style configurations

[tool.black]
line-length = 160  # Longer lines to keep function definitions together
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.ruff]
line-length = 160  # Match Black's line length
target-version = "py312" 
extend-exclude = ["docs", "build", "__pycache__", ".git", "tleHandling.py"]  # vendored Basilisk reference, not project source
src = [".", "SRC"]  # first-party roots; the default "src" does not match SRC/ on case-sensitive file systems

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",  # line too long (Black handles this)
    "W505",  # doc line too long (consistent with E501; long aligned docstring tables are intentional)
    "B008",  # do not perform function calls in argument defaults
    "N801",  # class name CapWords (e.g. Orbit_specification is an established public name)
    "N802",  # function name should be lowercase (scientific names: R_v, TLE, Bstar, satID, ...)
    "N803",  # argument name should be lowercase (for scientific variables)
    "N806",  # variable name should be lowercase (for scientific variables)
    "N811",  # constant imported as non-constant (acronym class alias, e.g. BRP as Backscatter)
    "N812",  # lowercase imported as non-lowercase (clarifying alias, e.g. a as WGS84_A)
    "N815",  # mixedCase class-scope variable (scientific names: tx_satID, rx_satID)
    "N999",  # invalid module name (SRC package + entry-point scripts cannot be snake_case-renamed)
    "SIM108", # Use ternary operator instead of if-else-block (allow both styles)
    "SIM401", # Use ternary operator instead of if-else-block that returns (allow both styles)
]

[tool.ruff.lint.isort]
known-first-party = ["gnss_r_simulator"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Imports intentionally placed after setup (matplotlib backend, sys.path, warnings filter,
# the datetime.UTC monkeypatch). E402 is correct for normal files, so suppress it only here.
"SRC/__init__.py" = ["E402"]
"SRC/main_simulation_areaCoverage.py" = ["E402"]
"SRC/object_definitions/ShipTrajectory_def.py" = ["E402"]
"tests/golden/regenerate_gains.py" = ["E402"]
"tests/golden/regenerate_link_budget.py" = ["E402"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 160

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Relaxed for scientific code
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true  # For scientific packages

[[tool.mypy.overrides]]
# Only modules actually imported in SRC; the global ignore_missing_imports above already covers
# the rest, so listing unimported packages here just produces "unused override" notes.
module = [
    "skyfield.*",
    "sgp4.*",
    "cartopy.*",
    "geopandas.*",
    "imageio.*",
    "networkx.*",  # Added for graph algorithms
]
ignore_missing_imports = true

# Style guidelines for consistency
[tool.ruff.lint.pydocstyle]
convention = "numpy"  # Use NumPy docstring style for scientific code

[tool.pytest.ini_options]
# SRC isn't installed as a package — entry-point scripts rely on SRC being on sys.path. Mirror
# that for pytest so test modules can do `from functions.rotations import build_vnc_frame` etc.
pythonpath = ["SRC", "tests"]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "golden: end-to-end golden-file comparison tests; slower than unit tests.",
]
