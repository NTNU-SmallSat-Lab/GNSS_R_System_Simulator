[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnss-r-simulator"
version = "0.1.0"
description = "GNSS-R Simulator for marine vessel detection"
authors = [
    {name = "Oliver Hasler", email = "oliver.hasler@ntnu.no"},
    {name = "Corrado Chiatante", email = "corrado.chiatante@ntnu.no"},
]
requires-python = ">=3.12.6"  # Updated for Black compatibility
dependencies = [
    # Core scientific computing
    "numpy>=2.0.2",
    "pandas>=2.2.3", 
    "scipy>=1.14.1",
    "matplotlib>=3.10.1",
    
    # Space science and astronomy
    "astropy>=6.1.6",
    "astropy-iers-data>=0.2024.11.0",
    "poliastro>=0.7.0",
    "skyfield>=1.49",
    "sgp4>=2.23", 
    "jplephem>=2.22",
    "pyerfa>=2.0.1",
    
    # Geospatial and mapping
    "cartopy>=0.24.1",
    "geopandas>=1.0.1", 
    "pyproj>=3.7.0",
    "shapely>=2.0.6",
    "pymap3d>=3.1.0",
    "pyshp>=2.3.1",
    "pyogrio>=0.10.0",
    
    # Graph algorithms and path planning
    "networkx>=3.4.2",  # Added for ship trajectory path planning
    
    # Data formats and I/O
    "netCDF4>=1.7.2",
    "cftime>=1.6.4",
    "requests>=2.32.3",
    "PyYAML>=6.0.2",
    
    # NASA data access
    "podaac-data-subscriber>=1.15.2",
    "harmony-py>=0.4.15",
    
    # Performance and utilities
    "numba>=0.60.0",
    "imageio>=2.37.0",
    "pillow>=10.4.0",
    "tqdm>=4.67.1",
    "beautifulsoup4>=4.12.3",
    
    # Time handling
    "python-dateutil>=2.8.2",
    "pytz>=2025.1",
    
    # GUI (if needed)
    "PyQt5>=5.15.11",
]

[project.optional-dependencies]
# Code formatting and development tools only
dev = [
    "black>=25.1.0",  # Latest version compatible with Python 3.12.6
    "ruff>=0.8.2",
    "mypy>=1.13.0",
]

[project.urls]
Repository = "https://github.com/NTNU-SmallSat-Lab/GNSS_R_System_Simulator.git"

# Code formatting and style configurations

[tool.black]
line-length = 140  # Longer lines to keep function definitions together
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.ruff]
line-length = 140  # Match Black's line length
target-version = "py312" 
extend-exclude = ["docs", "build", "__pycache__", ".git"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",  # line too long (Black handles this)
    "B008",  # do not perform function calls in argument defaults
    "N806",  # variable name should be lowercase (for scientific variables)
    "N803",  # argument name should be lowercase (for scientific variables)
    "SIM108", # Use ternary operator instead of if-else-block (allow both styles)
    "SIM401", # Use ternary operator instead of if-else-block that returns (allow both styles)
]

[tool.ruff.lint.isort]
known-first-party = ["gnss_r_simulator"]
force-sort-within-sections = true
lines-between-types = 1
combine-as-imports = true

[tool.ruff.lint.pycodestyle]
max-doc-length = 140

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Relaxed for scientific code
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true  # For scientific packages

[[tool.mypy.overrides]]
module = [
    "poliastro.*",
    "skyfield.*", 
    "sgp4.*",
    "harmony.*",
    "podaac.*",
    "cartopy.*",
    "geopandas.*",
    "pyogrio.*",
    "astropy.*",
    "numba.*",
    "imageio.*",
    "PyQt5.*",
    "networkx.*",  # Added for graph algorithms
]
ignore_missing_imports = true

# Style guidelines for consistency
[tool.ruff.lint.pydocstyle]
convention = "numpy"  # Use NumPy docstring style for scientific code