; ============================================================================
; Monte Carlo feasibility study -- BACKSCATTER ship detection.
; Platform is fixed at the Chapter-11 paper settings (6U, 2-sat SSO, GPS+Galileo);
; the [MONTE CARLO] section lists the variables that are sampled per trial.
; Read by SRC/run_monte_carlo.py:  python SRC/run_monte_carlo.py Configuration_mc_backscatter.ini
; ============================================================================

[SIMULATION SETTINGS]
; Base epoch; the Monte Carlo draws a start time within +/- epoch_window_hours of this.
starttime = 01.10.2025 12:00:00

[MOVING TARGET]
; Near-static loiter. Per trial the runner overrides start_pos (drawn on-water) and
; end_pos (start nudged along the drawn heading) so the window equals [MONTE CARLO].window_hours.
speed = 0.1
start_pos = [66.0, 6.0]
end_pos   = [66.01, 6.0]

[ANTENNA PATTERN]
; 6U platform: 3 x 4 element array, half-wavelength spacing at L1/E1 (0.0951 m).
elements_along_x      = 3
elements_along_y      = 4
d_x                   = 0.0951
d_y                   = 0.0951
along_track_steering  = [-40, 40]
across_track_steering = [-40, 40]

[ANTENNA]
; GPS + Galileo signals as described in the chapter.
bands = ["L1", "L5", "E1", "E5a", "E5b"]
footprint_db = -3.0

[ORBITS]
; 2-satellite sun-synchronous lead-follower (~922 km alt), true anomaly offset 90 deg.
orbit1 = [99.1, 1e-05, 0.0, 0.0,  0.0, 7300000.0]
orbit2 = [99.1, 1e-05, 0.0, 0.0, 90.0, 7300000.0]

[GNSS CONSTELLATIONS]
gnss_tle_files = [GPS_operational.tle, GALILEO.tle]

[COVERAGE]
; Unused in moving-target mode (ShipTrajectory writes per-ship_id shapefiles); kept for INI validity.
shapefile_path = DATA/autogenerated_ship_trajectory/MC_backscatter_0_trajectory.shp

[REFLECTION]
earth_model = "elliptical"
reflection_type = "backscatter"
max_central_angle_deg = 80.0
max_incidence_angle_deg = 45.0

[PLOT]
detection_bbox_buffer_deg = 10.0
create_animation = False
animation_filename = mc.gif
animation_fps = 1

[LINK BUDGET]
; Base receiver. The Monte Carlo overrides coherent_integration_time_s, num_incoherent_looks,
; and system_noise_temperature_k per trial (receiver-capability axis).
system_losses_db = 2.0
polarization_losses_db = 0.5
noise_bandwidth_hz = 2.0e6
system_noise_temperature_k = 290.0
detection_sinr_threshold_db = 0.0
ocean_patch_integration_enabled = false
ocean_patch_grid_size = 9
delay_doppler_cell_enabled = true
coherent_integration_time_s = 0.001
num_incoherent_looks = 1

[OCEAN]
; Base sea state. The Monte Carlo overrides wind speed/direction, wave height, and inverse wave age.
ocean_wave_height_m       = 2.5
ocean_wind_speed_m_s      = 10.0
ocean_wind_direction_deg  = 270.0
ocean_sea_temperature_c   = 9.0
ocean_salinity_psu        = 35.0
ocean_inverse_wave_age    = 0.84

[SHIP]
length_m    = 330.0
beam_m      = 60.0
freeboard_m = 20.0

[MONTE CARLO]
; Number of trials and RNG seed (reproducible draws).
n_trials = 500
seed = 42
; Per-trial simulation window [h]; start/end positions are set so the ship travels for this long.
window_hours = 6
; --- environmental / geometry axis ---
vary_heading = true
vary_position = true
; ROI for position draws (open Norwegian waters); off-water draws are rejected and redrawn.
roi_bbox = [0.0, 18.0, 62.0, 71.0]
vary_epoch = true
epoch_window_hours = 168
vary_sea_state = true
wind_speed_range_m_s = [4.0, 16.0]
wave_height_range_m = [0.5, 4.5]
wind_direction_range_deg = [0.0, 360.0]
inverse_wave_age_range = [0.84, 2.0]
; --- receiver capability axis (cheap scalar knobs) ---
vary_coherent_integration = true
coherent_integration_time_s_values = [0.001, 0.01, 0.1, 1.0]
vary_incoherent_looks = true
num_incoherent_looks_values = [1, 10, 100, 1000]
vary_system_noise_temperature = true
system_noise_temperature_k_range = [150.0, 400.0]
