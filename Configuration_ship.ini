[SIMULATION SETTINGS]
starttime = 31.05.2026 12:00:00
stepsize = 20

[MOVING TARGET]
speed = 15
start_pos = [54.199416, 7.892937]
end_pos = [69.345572, 33.646450]

[ANTENNA PATTERN]
elements_along_x    = 3
elements_along_y    = 4
d_x                 = 0.1
d_y                 = 0.1
freqs               = [1176.45, 1575.42]
; Beam steering sweep (two-plane scan), each [start_deg, end_deg, n_steps]:
; azimuth = beam tilt along the array x-axis, elevation = tilt along the y-axis. Signed ranges
; (boresight = 0); include 0 in both. Per-axis max steering = max(|sweep|) is derived from these.
; Constraint: sin^2(max_az) + sin^2(max_el) <= 1.
azimuth_steering   = [-40, 40, 20]
elevation_steering = [-40, 40, 20]
theta_resolution      = 180
phi_resolution        = 360

[ANTENNA]
; The pattern folder is fixed in Constants.antenna_pattern_folder (data/ANTENNA/antenna_patterns),
; generator-owned when [ANTENNA PATTERN] is present -- keep only current-config pattern files there.
polarizations = ["RHCP", "LHCP"]
; Bands are constellation-specific signals: L1/L2/L5=GPS, E1/E5a/E5b/E6=Galileo, G1/G2/G3=GLONASS,
; B1I/B1C/B2a/B2b/B2I/B3I=BeiDou. Each listed band drives ONLY its own constellation, at its own
; carrier frequency and EIRP; the link budget and all outputs are produced per band. A band that is
; unknown, or whose constellation is not in [GNSS CONSTELLATIONS], is warned about and skipped (the
; run continues). Each band's frequency must have a generated antenna pattern (see [ANTENNA PATTERN].freqs).
; e.g. ["L1", "E1", "B1C"] covers GPS/Galileo/BeiDou at the L1 (1575.42 MHz) frequency.
bands = ["L1"]
; Footprint contour in dB relative to the normalized pattern peak.
footprint_db = -1.0

[ORBITS]
orbit1 = [98.2, 1e-05, 300.0, 0.0, 0.0, 7100000.0]
orbit2 = [98.2, 1e-05, 300.0, 0.0, 120.0, 7100000.0]
orbit3 = [98.2, 1e-05, 300.0, 0.0, 240.0, 7100000.0]

[GNSS CONSTELLATIONS]
gnss_tle_files = [GPS_operational.tle, GALILEO.tle, BEIDOU.tle]

[COVERAGE]
shapefile_path = data/autogenerated_ship_trajectory/DarkShip_001_trajectory.shp

[REFLECTION]
reflection_type = "backscatter"
; Max Tx-Rx central angle (deg) — coarse geometric filter, applies to both specular and backscatter.
max_central_angle_deg = 45.0
; Max incidence angle (deg) at the reflection point, measured from the local surface normal
; (0° = normal incidence, 90° = grazing). Backscatter only; specular geometry constrains
; incidence implicitly via the mirror condition.
max_incidence_angle_deg = 45.0

[PLOT]
; Padding in degrees added around the moving-target bounding box when rendering detection plots.
detection_bbox_buffer_deg = 10.0
; Animation (moving-target only, GIF output). create_animation = True enables it; the other keys
; are required only when create_animation = True.
; Frames are emitted on the native reflection-sample grid (= stepsize), one per timestamp that
; has a reflection inside the map extent, so the points are shown traveling rather than blinking.
create_animation         = True
animation_filename       = Reflection_animation.gif
animation_fps            = 1

[LINK BUDGET]
; Receiver-system parameters. Both are fixed (geometry-independent) Rx-side losses that lump
; into the radar-equation loss term L; transmit EIRP is per-(constellation, band) and lives in
; Constants.GNSS_EIRP_DBW, not here.
;   - system_losses_db: lumped implementation loss (feedline/connector, filter insertion, ADC
;     quantization, correlator/processing loss). A catch-all so the budget is not optimistic.
;   - polarization_losses_db: receiver antenna polarization-mismatch loss from finite axial ratio.
;     NOT the RHCP->LHCP handedness flip on reflection (that is in the OceanTarget RCS) -- only the
;     residual antenna-vs-wave mismatch, so the reflection flip is not double-counted here.
system_losses_db = 2.0
polarization_losses_db = 0.5

[OCEAN]
; Sea-state and water-property inputs for the bistatic ocean RCS model.
;   - Wave height is reported as a Rayleigh roughness diagnostic.
;   - Wind speed drives the Cox-Munk slope variances (upwind and crosswind).
;   - Wind direction is the meteorological FROM bearing (degrees, clockwise from north).
;   - Temperature and salinity feed the Klein-Swift seawater permittivity.
;   - Inverse wave age (Omega_c) drives the Elfouhaily spectrum behind the Bragg backscatter NRCS
;     (0.84 = fully developed sea; up to ~5 for young, growing seas).
ocean_wave_height_m       = 1.5
ocean_wind_speed_m_s      = 7.0
ocean_wind_direction_deg  = 270.0
ocean_sea_temperature_c   = 10.0
ocean_salinity_psu        = 35.0
ocean_inverse_wave_age    = 0.84

[SHIP]
; Physical dimensions of the moving target, above the waterline only — submerged hull
; does not contribute to RCS at GNSS L band. All values must be > 0.
length_m    = 100.0
beam_m      = 15.0
freeboard_m = 5.0
