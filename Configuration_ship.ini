[SIMULATION SETTINGS]
starttime = 17.05.2025 12:00:00
stepsize = 30

[MOVING TARGET]
speed = 15
start_pos = [54.199416, 7.892937]
end_pos = [69.345572, 33.646450]

[ANTENNA PATTERN]
elements_along_x    = 3
elements_along_y    = 4
d_x                 = 0.1
d_y                 = 0.1
freqs               = [1176.45, 1575.42]
elevation_directivity = [0, 20, 40]
azimuth_directivity   = [0, 359, 72]
theta_resolution      = 180
phi_resolution        = 360

[ANTENNA]
; This folder is generator-owned when [ANTENNA PATTERN] is present.
; Keep only pattern files produced for the current antenna configuration here.
pattern_folder = data/ANTENNA/antenna_patterns_ship
; Fixed nadir-looking antenna max off-boresight (FOV half-angle) limit.
max_fov_angle_deg = [0, 40]
polarizations = ["RHCP", "LHCP"]
bands = ["L1"]
; Footprint contour in dB relative to the normalized pattern peak.
footprint_db = -1.0

[ORBITS]
no_satellites = 3
orbit1 = [98.2, 1e-05, 300.0, 0.0, 0.0, 7100000.0]
orbit2 = [98.2, 1e-05, 300.0, 0.0, 120.0, 7100000.0]
orbit3 = [98.2, 1e-05, 300.0, 0.0, 240.0, 7100000.0]

[GNSS CONSTELLATIONS]
gnss_tle_files = [GPS_operational.tle, GALILEO.tle, BEIDOU.tle]

[COVERAGE]
shapefile_path = data/autogenerated_ship_trajectory/DarkShip_001_trajectory.shp

[REFLECTION]
reflection_type = "backscatter"
; Max Tx-Rx central angle (deg) — coarse geometric filter, applies to both specular and backscatter.
max_central_angle_deg = 80.0
; Max incidence angle (deg) at the reflection point, measured from the local surface normal
; (0° = normal incidence, 90° = grazing). Backscatter only; specular geometry constrains
; incidence implicitly via the mirror condition.
max_incidence_angle_deg = 45.0

[PLOT]
; Padding in degrees added around the moving-target bounding box when rendering detection plots.
detection_bbox_buffer_deg = 2.0

[LINK BUDGET]
; Receiver-system parameters. Transmit EIRP is per-(constellation, band) and lives in
; Constants.GNSS_EIRP_DBW, not here.
system_losses_db = 2.0
polarization_losses_db = 0.5

[OCEAN]
; Sea-state and water-property inputs for the bistatic ocean RCS model.
;   - Wave height is reported as a Rayleigh roughness diagnostic.
;   - Wind speed drives the Cox-Munk slope variances (upwind and crosswind).
;   - Wind direction is the meteorological FROM bearing (degrees, clockwise from north).
;   - Temperature and salinity feed the Klein-Swift seawater permittivity.
ocean_wave_height_m       = 1.5
ocean_wind_speed_m_s      = 7.0
ocean_wind_direction_deg  = 270.0
ocean_sea_temperature_c   = 10.0
ocean_salinity_psu        = 35.0

[SHIP]
; Physical dimensions of the moving target, above the waterline only — submerged hull
; does not contribute to RCS at GNSS L band. All values must be > 0.
length_m    = 100.0
beam_m      = 15.0
freeboard_m = 5.0
