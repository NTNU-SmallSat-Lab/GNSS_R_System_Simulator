[SIMULATION SETTINGS]
starttime = 03.06.2026 12:00:00
stepsize = 30

[MOVING TARGET]
speed = 15
start_pos = [54.199416, 7.892937]
end_pos = [69.345572, 33.646450]

[ANTENNA PATTERN]
elements_along_x    = 3
elements_along_y    = 4
d_x                 = 0.1
d_y                 = 0.1
freqs               = [1176.45, 1575.42]
elevation_directivity = [0, 20, 20]
azimuth_directivity   = [0, 359, 36]
elevation_resolution  = 180
azimuth_resolution    = 360

[ANTENNA]
; This folder is generator-owned when [ANTENNA PATTERN] is present.
; Keep only pattern files produced for the current antenna configuration here.
pattern_folder = data/ANTENNA/antenna_patterns_ship
max_steering_angle_deg = [0, 40]
polarizations = ["RHCP", "LHCP"]
bands = ["L1"]
; Footprint contour in dB relative to the normalized pattern peak.
footprint_db = -3.0

[ORBITS]
; 8 Rx satellites from CELESTE_IOD3_RX.tle
; Each Rx trails its Tx by 350 km along-track (= 2.889° mean anomaly)
; Orbital period: ~96 minutes (15.01748119 rev/day)
; Altitude: ~561 km
; inc=97.4° (polar), ecc=0.0011314 (nearly circular)
; Ordered for progressive testing: 1→2→4→8 satellites per plane diversity
no_satellites = 8
orbit1 = [97.4, 0.0011314,    0.0, 250.717,    2.89, 6939643]      ; RX_01 - Plane A (RAAN=0°)
orbit2 = [97.4, 0.0011314,   17.16, 250.717,   12.60, 6939643]     ; RX_02 - Plane B (RAAN=17.16°)
orbit3 = [97.4, 0.0011314,  135.0, 250.717,    2.89, 6939643]      ; RX_05 - Plane C (RAAN=135°)
orbit4 = [97.4, 0.0011314,  152.16, 250.717,   12.60, 6939643]     ; RX_06 - Plane D (RAAN=152.16°)
orbit5 = [97.4, 0.0011314,    0.0, 250.717,   22.32, 6939643]      ; RX_03 - Plane A (RAAN=0°)
orbit6 = [97.4, 0.0011314,   17.16, 250.717,   32.03, 6939643]     ; RX_04 - Plane B (RAAN=17.16°)
orbit7 = [97.4, 0.0011314,  135.0, 250.717,   22.32, 6939643]      ; RX_07 - Plane C (RAAN=135°)
orbit8 = [97.4, 0.0011314,  152.16, 250.717,   32.03, 6939643]     ; RX_08 - Plane D (RAAN=152.16°)

[GNSS CONSTELLATIONS]
gnss_tle_files = [CELESTE_IOD3.tle]

[COVERAGE]
shapefile_path = data/autogenerated_ship_trajectory/DarkShip_001_trajectory.shp

[REFLECTION]
reflection_type = "backscatter"
; cutoff_angle: central-angle gate between Tx and Rx (degrees).
; For LEO-LEO backscatter at 568 km, the useful window is ~47–90 deg.
cutoff_angle = 90
; min_tx_elevation_deg: minimum Tx elevation angle at the BRP [deg].
; 30° matches the area-coverage simulation and ensures the Tx illuminates
; the BRP from a geometry suitable for dihedral corner-reflector backscatter.
min_tx_elevation_deg = 30.0
; max_bistatic_angle_deg: maximum bistatic angle at the BRP [deg].
; Corner-reflector retroreflection requires both Tx and Rx to appear from
; nearly the same direction (small β).  10° is the threshold used in the
; area-coverage simulation.  Set to 0 to disable.
max_bistatic_angle_deg = 10.0

[LINK BUDGET]
; Simple first-order model:
;   sigma = sigma0(theta_i) * A_fresnel * fresnel_rcs_scale
; `ocean_sigma*` values are effective calibration parameters in this model
; (not a full coherent/diffuse ocean scattering model).
tx_eirp_dbw = 27.0
system_losses_db = 2.0
polarization_losses_db = 0.5
ocean_sigma0_db = -20.0
ocean_sigma_slope_db_per_deg = 0.25
ocean_sigma_floor_db = -45.0
fresnel_rcs_scale = 1.0
