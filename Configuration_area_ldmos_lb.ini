[SIMULATION SETTINGS]
;DD:MM:YYYY HH:mm:ss
startTime = 03.06.2026 12:00:00
stepSize = 30
simulationDuration = 24

[COVERAGE]
shapefile_path = data/International_hydrographic_organization/iho_norwegian_coast.shp
grid_size_meters = 30_000

[ANTENNA PATTERN]
elements_along_x    = 3
elements_along_y    = 4
d_x                 = 0.1
d_y                 = 0.1
freqs               = [1176.45, 1575.42]
elevation_directivity = [0, 20, 5]
azimuth_directivity   = [0, 358, 5]
elevation_resolution  = 180
azimuth_resolution    = 360

[ANTENNA]
pattern_folder = data/ANTENNA/antenna_patterns_area
max_steering_angle_deg = [0, 40]
polarizations = ["RHCP", "LHCP"]
bands = ["L1"]
footprint_db = -1.0

[ORBITS]
; 1 Rx satellite (CELESTE IOD3 plane A) — same as current LEO PNT scenario
orbit1 = [97.4, 0.0001, 0.0, 0, 249.74, 6939e3]

[GNSS CONSTELLATIONS]
; 1 CELESTE IOD3 Tx satellite (LEO ~568 km) — Silicon LDMOS PA scenario
gnss_tle_files = [CELESTE_IOD3_1tx.tle]

[LINK BUDGET]
; Silicon LDMOS: 52 dBm output, 14 dBi peak gain → EIRP = 36 dBW
; Fixed peak gain — beam assumed always pointed at cell (optimistic bound)
tx_type = fixed_gain
tx_pa_output_dbm = 52.0
tx_gain_dbi = 14.0
tx_frequency_mhz = 1575.42
system_losses_db = 2.0
polarization_losses_db = 0.5
ocean_sigma0_db = -20.0
ocean_sigma_slope_db_per_deg = 0.25
ocean_sigma_floor_db = -45.0
fresnel_rcs_scale = 1.0

; Rx noise parameters
rx_system_noise_temp_k = 290.0
rx_bandwidth_mhz = 10.0
