<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img"
     aria-labelledby="title desc" font-family="'Segoe UI', Arial, sans-serif">
  <title id="title">Specular reflection geometry</title>
  <desc id="desc">A GNSS transmitter T and a LEO receiver R above a curved Earth surface. The signal
    travels from T down to the specular point S on the surface and reflects up to R. The incidence angle
    theta_i (between the incoming ray and the local surface normal) equals the reflection angle theta_r,
    the law of reflection. The normal is radial. The geocentric central angle theta_c, subtended at the
    Earth's centre O between the transmitter and receiver position vectors r_tx and r_rx, is the coarse
    pre-filter. The illuminated glistening zone surrounds S.</desc>

  <defs>
    <marker id="ray" markerWidth="10" markerHeight="10" refX="8" refY="5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16212c"/>
    </marker>
    <style>
      .card    { fill:#ffffff; stroke:#d7dde4; stroke-width:1; }
      .earthf  { fill:#e8f0fe; stroke:none; }
      .earth   { fill:none; stroke:#3b6ea5; stroke-width:2; }
      .ray     { stroke:#16212c; stroke-width:2.2; fill:none; }
      .normal  { stroke:#7c8b9a; stroke-width:1.6; stroke-dasharray:6 5; fill:none; }
      .tangent { stroke:#9aa7b4; stroke-width:1.2; stroke-dasharray:2 4; fill:none; }
      .posvec  { stroke:#5b6874; stroke-width:1.3; stroke-dasharray:5 4; fill:none; }
      .radial  { stroke:#9aa7b4; stroke-width:1.1; stroke-dasharray:2 4; fill:none; }
      .zone    { stroke:#c8862a; fill:none; }
      .zonefill{ fill:#fdf0dd; fill-opacity:0.75; stroke:none; }
      .arc     { stroke:#b0392b; stroke-width:1.8; fill:none; }
      .panel   { fill:#9fb6d0; stroke:#3b6ea5; stroke-width:1; }
      .body    { fill:#ffffff; stroke:#16212c; stroke-width:1.4; }
      .lblc    { fill:#16212c; font-size:15px; text-anchor:middle; }
      .lbll    { fill:#16212c; font-size:15px; text-anchor:start; }
      .lblr    { fill:#16212c; font-size:15px; text-anchor:end; }
      .pt      { fill:#16212c; font-size:16px; font-weight:bold; }
      .ang     { fill:#b0392b; font-size:15px; font-style:italic; text-anchor:middle; }
      .sub     { fill:#b0392b; font-size:11px; font-style:italic; }
      .vec     { fill:#5b6874; font-size:13px; font-style:italic; }
      .note    { fill:#5b6874; font-size:12.5px; text-anchor:middle; }
    </style>
  </defs>

  <rect class="card" x="4" y="4" width="632" height="412" rx="10"/>

  <!-- Earth: chunk of the globe, symmetric about the vertical through S so the normal at S is radial -->
  <path class="earthf" d="M190,280 C245,187 395,187 450,280 L450,416 L190,416 Z"/>
  <path class="earth"  d="M190,280 C245,187 395,187 450,280"/>

  <!-- Earth centre O and the two position vectors r_tx, r_rx that subtend the central angle -->
  <line class="radial" x1="320" y1="210" x2="320" y2="366"/>
  <line class="posvec" x1="320" y1="366" x2="438" y2="42"/>
  <line class="posvec" x1="320" y1="366" x2="256" y2="118"/>
  <circle cx="320" cy="366" r="3.5" fill="#16212c"/>
  <text class="note" x="320" y="388">Earth centre O</text>
  <text class="vec" x="406" y="150">r<tspan font-size="10" dy="4">tx</tspan></text>
  <text class="vec" x="258" y="150" text-anchor="end">r<tspan font-size="10" dy="4">rx</tspan></text>

  <!-- Central angle theta_c at O between r_tx and r_rx (the coarse pre-filter) -->
  <path class="arc" d="M306,313 A55 55 0 0 1 339,314"/>
  <text class="ang" x="324" y="292">&#952;<tspan class="sub" dy="4">c</tspan></text>

  <!-- Glistening zone on the tangent plane around S -->
  <ellipse class="zonefill" cx="320" cy="210" rx="88" ry="14"/>
  <ellipse class="zone" cx="320" cy="210" rx="88" ry="14" stroke-width="1.6" stroke-dasharray="7 5"/>
  <ellipse class="zone" cx="320" cy="210" rx="50" ry="8" stroke-width="1.4" stroke-dasharray="5 5" stroke-opacity="0.7"/>
  <text class="lbll" x="430" y="214" fill="#c8862a" font-size="12.5">glistening zone</text>

  <!-- Local tangent plane and radial surface normal at S -->
  <line class="tangent" x1="244" y1="210" x2="396" y2="210"/>
  <line class="normal"  x1="320" y1="210" x2="320" y2="116"/>
  <polygon points="320,110 316,122 324,122" fill="#7c8b9a"/>
  <text class="lblr" x="312" y="126" fill="#5b6874" font-size="14">n&#770;</text>

  <!-- Incident ray T -> S and reflected ray S -> R (exact mirror about the normal) -->
  <line class="ray" x1="421" y1="67" x2="326" y2="202" marker-end="url(#ray)"/>
  <line class="ray" x1="320" y1="210" x2="270" y2="139" marker-end="url(#ray)"/>

  <!-- Equal angles from the normal: theta_i (to T) and theta_r (to R) -->
  <path class="arc" d="M320,170 A40 40 0 0 1 343,177"/>
  <path class="arc" d="M320,170 A40 40 0 0 0 297,177"/>
  <text class="ang" x="352" y="184">&#952;<tspan class="sub" dy="4">i</tspan></text>
  <text class="ang" x="280" y="184">&#952;<tspan class="sub" dy="4">r</tspan></text>

  <!-- Specular point marker -->
  <circle cx="320" cy="210" r="4.5" fill="#16212c"/>
  <text class="pt" x="330" y="204">S</text>

  <!-- Transmitter (GNSS), far, upper right -->
  <g>
    <rect class="panel" x="406" y="37" width="20" height="11"/>
    <rect class="panel" x="450" y="37" width="20" height="11"/>
    <rect class="body"  x="428" y="33" width="20" height="18" rx="2"/>
    <line x1="438" y1="33" x2="438" y2="26" stroke="#16212c" stroke-width="1.4"/>
    <circle cx="438" cy="23" r="3" fill="#16212c"/>
  </g>
  <text class="lblr" x="400" y="40">GNSS transmitter, <tspan font-weight="bold">T</tspan></text>

  <!-- Receiver (LEO), nearer, upper left -->
  <g>
    <rect class="panel" x="226" y="113" width="18" height="10"/>
    <rect class="panel" x="268" y="113" width="18" height="10"/>
    <rect class="body"  x="246" y="110" width="20" height="16" rx="2"/>
  </g>
  <text class="lblc" x="250" y="100">LEO receiver, <tspan font-weight="bold">R</tspan></text>
</svg>
