<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" role="img"
     aria-labelledby="title desc" font-family="'Segoe UI', Arial, sans-serif">
  <title id="title">GNSS-R processing pipeline</title>
  <desc id="desc">Shared core (parse INI, propagate constellations, reflection geometry). The geometry
    forks into a specular lane and a backscatter lane. Area coverage counts revisits from the specular
    geometry and skips the link budget; the moving-target detections share the link budget but produce
    different metrics: the forward shadow for specular and the SCR / SINR for backscatter.</desc>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7c8b9a"/>
    </marker>
    <style>
      .step   { fill:#e8f0fe; stroke:#3b6ea5; stroke-width:1.5; }
      .mode   { fill:#e8f6ea; stroke:#4a8c5a; stroke-width:1.5; }
      .metric { fill:#f3e8fb; stroke:#8a5cb8; stroke-width:1.5; }
      .out    { fill:#fdf0dd; stroke:#c8862a; stroke-width:1.5; }
      .lbl    { fill:#16212c; font-size:14px; text-anchor:middle; }
      .mlbl   { fill:#16212c; font-size:14px; text-anchor:middle; }
      .msub   { fill:#5a6b7a; font-size:11px; font-style:italic; text-anchor:middle; }
      .flow   { fill:none; stroke:#7c8b9a; stroke-width:2; }
    </style>
  </defs>

  <!-- shared spine -->
  <rect class="step" x="230" y="20"  width="300" height="46" rx="8"/>
  <text class="lbl" x="380" y="48">1.  Parse INI  &#8594;  settings + band plan</text>

  <rect class="step" x="230" y="92"  width="300" height="46" rx="8"/>
  <text class="lbl" x="380" y="120">2.  Build &amp; propagate constellations</text>

  <rect class="step" x="230" y="164" width="300" height="46" rx="8"/>
  <text class="lbl" x="380" y="192">3.  Reflection geometry</text>

  <!-- geometry fork: two reflection lanes -->
  <rect class="mode" x="120" y="250" width="190" height="46" rx="8"/>
  <text class="lbl" x="215" y="278">Specular reflection</text>

  <rect class="mode" x="450" y="250" width="190" height="46" rx="8"/>
  <text class="lbl" x="545" y="278">Backscatter</text>

  <!-- shared link budget -->
  <rect class="step" x="280" y="336" width="200" height="46" rx="8"/>
  <text class="lbl" x="380" y="364">4.  Link budget</text>

  <!-- forked metrics -->
  <rect class="metric" x="20"  y="430" width="180" height="52" rx="8"/>
  <text class="mlbl" x="110" y="452">Revisit counts</text>
  <text class="msub" x="110" y="470">(area coverage)</text>

  <rect class="metric" x="250" y="430" width="180" height="52" rx="8"/>
  <text class="mlbl" x="340" y="452">Forward shadow &#916;P</text>
  <text class="msub" x="340" y="470">(moving target)</text>

  <rect class="metric" x="510" y="430" width="180" height="52" rx="8"/>
  <text class="mlbl" x="600" y="452">SCR / SINR</text>
  <text class="msub" x="600" y="470">(moving target)</text>

  <!-- shared output -->
  <rect class="out" x="300" y="520" width="160" height="46" rx="8"/>
  <text class="lbl" x="380" y="548">Output</text>

  <!-- connectors: shared spine -->
  <path class="flow" d="M380,66  V92"  marker-end="url(#ah)"/>
  <path class="flow" d="M380,138 V164" marker-end="url(#ah)"/>

  <!-- geometry fork -->
  <path class="flow" d="M380,210 V230 H215 V250" marker-end="url(#ah)"/>
  <path class="flow" d="M380,210 V230 H545 V250" marker-end="url(#ah)"/>

  <!-- specular lane: to the link budget, and (bypassing it) to area coverage -->
  <path class="flow" d="M240,296 V316 H330 V336" marker-end="url(#ah)"/>
  <path class="flow" d="M190,296 V410 H110 V430" marker-end="url(#ah)"/>

  <!-- backscatter lane into the link budget -->
  <path class="flow" d="M545,296 V316 H430 V336" marker-end="url(#ah)"/>

  <!-- link budget forks into the two detection metrics -->
  <path class="flow" d="M340,382 V430" marker-end="url(#ah)"/>
  <path class="flow" d="M450,382 V404 H600 V430" marker-end="url(#ah)"/>

  <!-- metrics to output -->
  <path class="flow" d="M110,482 V502 H300 V520" marker-end="url(#ah)"/>
  <path class="flow" d="M340,482 V520" marker-end="url(#ah)"/>
  <path class="flow" d="M600,482 V502 H440 V520" marker-end="url(#ah)"/>
</svg>
