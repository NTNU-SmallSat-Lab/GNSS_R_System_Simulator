orbit18 = [98.2, 1e-05, 240.0, 0.0, 150.0, 7100000.0]
orbit19 = [98.2, 1e-05, 240.0, 0.0, 240.0, 7100000.0]
orbit20 = [98.2, 1e-05, 240.0, 0.0, 330.0, 7100000.0]
orbit21 = [98.2, 1e-05, 300.0, 0.0,  75.0, 7100000.0]
