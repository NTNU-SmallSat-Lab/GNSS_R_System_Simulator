; ============================================================================
; Chapter-11 illustration case: dark-fleet oil tanker in the open Skagerrak.
; Static-ish target (slow loiter/drift) at ~58.30 N, 10.10 E, ~66 km from land.
; Snapshot anchored at 16:00 local (14:00 UTC) on 1 Oct 2025. Read by SRC/run_illustration.py,
; which runs both specular and backscatter modes off this single config.
; ============================================================================

[SIMULATION SETTINGS]
; 2 h window (13:00-15:00 UTC) bracketing the 16:00 local (14:00 UTC) snapshot.
starttime = 01.10.2025 13:00:00

[MOVING TARGET]
; Slow loiter/drift so the tanker is effectively at one location over the window
; (representative of a dark-fleet vessel loitering / doing ship-to-ship transfer).
; ~0.37 km over the 2 h window at 0.1 kn -> effectively static.
speed = 0.1
start_pos = [58.30, 10.10]
end_pos   = [58.3033, 10.10]

[ANTENNA PATTERN]
elements_along_x      = 3
elements_along_y      = 4
d_x                   = 0.0951
d_y                   = 0.0951
along_track_steering  = [-40, 40]
across_track_steering = [-40, 40]

[ANTENNA]
bands = ["L1"]
footprint_db = -3.0

[ORBITS]
; Dense LEO GNSS-R Walker constellation (6 planes x 4 sats = 24), sun-synchronous ~722 km.
; Dense enough that a reflection point (specular / BRP) falls near the fixed ship within the window.
orbit1  = [98.2, 1e-05,   0.0, 0.0,   0.0, 7100000.0]
orbit2  = [98.2, 1e-05,   0.0, 0.0,  90.0, 7100000.0]
orbit3  = [98.2, 1e-05,   0.0, 0.0, 180.0, 7100000.0]
orbit4  = [98.2, 1e-05,   0.0, 0.0, 270.0, 7100000.0]
orbit5  = [98.2, 1e-05,  60.0, 0.0,  15.0, 7100000.0]
orbit6  = [98.2, 1e-05,  60.0, 0.0, 105.0, 7100000.0]
orbit7  = [98.2, 1e-05,  60.0, 0.0, 195.0, 7100000.0]
orbit8  = [98.2, 1e-05,  60.0, 0.0, 285.0, 7100000.0]
orbit9  = [98.2, 1e-05, 120.0, 0.0,  30.0, 7100000.0]
orbit10 = [98.2, 1e-05, 120.0, 0.0, 120.0, 7100000.0]
orbit11 = [98.2, 1e-05, 120.0, 0.0, 210.0, 7100000.0]
orbit12 = [98.2, 1e-05, 120.0, 0.0, 300.0, 7100000.0]
orbit13 = [98.2, 1e-05, 180.0, 0.0,  45.0, 7100000.0]
orbit14 = [98.2, 1e-05, 180.0, 0.0, 135.0, 7100000.0]
orbit15 = [98.2, 1e-05, 180.0, 0.0, 225.0, 7100000.0]
orbit16 = [98.2, 1e-05, 180.0, 0.0, 315.0, 7100000.0]
