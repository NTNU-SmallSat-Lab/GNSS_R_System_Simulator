[GNSS CONSTELLATIONS]
gnss_tle_files = [GPS_operational.tle]

[COVERAGE]
shapefile_path = DATA/autogenerated_ship_trajectory/DarkShip_001_trajectory.shp

[REFLECTION]
earth_model = "elliptical"
reflection_type = "backscatter"
max_central_angle_deg = 60.0
max_incidence_angle_deg = 80.0

[PLOT]
detection_bbox_buffer_deg = 5.0
create_animation = False
animation_filename = illustration.gif
animation_fps = 1

[LINK BUDGET]
system_losses_db = 2.0
