; ============================================================================
; Simulator configuration, read by both entry points (launch from the repo root):
;   SRC/main_simulation_areaCoverage.py  -- area coverage over [COVERAGE].shapefile_path
;   SRC/main_simulation_movingTarget.py  -- moving-target detection along the [MOVING TARGET] route
; Sections marked "area coverage only" or "moving target only" are ignored by the other mode.
; SRC/run_monte_carlo.py reads this file too, plus a [MONTE CARLO] section (see README.md).
; INI-strict: required keys must be present, missing keys raise. List/number values are parsed
; literally, e.g. bands = ["L1", "E1"]. Comments may start with ';' or '#'; section/key names are
; case-insensitive. Engine/numerical settings (step size, pattern resolution) live in
; simulator_settings.yaml.
; ============================================================================

[SIMULATION SETTINGS]
; startTime: simulation epoch, UTC. Strict format dd.MM.YYYY HH:mm:ss (24-hour). Keep it close to the
; epochs of the TLE files in [GNSS CONSTELLATIONS].
startTime = 02.04.2025 12:00:00
; simulationDuration: area coverage only -- length of the coverage window in whole hours (integer > 0).
; Moving-target runs take their duration from the ship route.
simulationDuration = 6

[COVERAGE]
; Area coverage only.
; shapefile_path: region polygon shapefile to grid and score (path relative to the repo root).
shapefile_path = DATA/eez/eez_norge.shp
; grid_size_meters: equidistant grid cell size in METERS (integer > 0; digit underscores allowed,
; e.g. 30_000 = 30 km). Sets the *_gridded_m.shp resolution; smaller = finer and slower.
grid_size_meters = 30_000
; max_bistatic_bksc_angle_deg: near-backscatter acceptance half-angle in (0, 90) deg -- REQUIRED when
; [REFLECTION].reflection_type = backscatter, unused (warns) for specular. A grid cell counts as
; backscatter-covered while its bistatic angle (angle at the cell between the directions to the GNSS
; transmitter and to the receiver; 0 = perfect retroreflection) stays below this value. It sets the
; swath half-width around the BRP track, beta_max / (1/R_rx - 1/R_tx) -- about 92 km for 5 deg at a
; 700 km orbit. It defines backscatter coverage only; the ocean RCS model has no such gate.
max_bistatic_bksc_angle_deg = 5

[MOVING TARGET]
; Moving target only. The presence of this section makes [SHIP] and the [PLOT] animation keys required.
; speed: target ground speed in knots (float > 0).
speed = 15
; start_pos / end_pos: [latitude_deg, longitude_deg] -- LATITUDE first, then longitude.
; latitude in [-90, 90], longitude in [-180, 180]. The route is auto-planned around land
; over the Natural Earth ocean mesh, so both endpoints must lie on water.
start_pos = [54.199416, 7.892937]
end_pos = [69.345572, 33.646450]

[ANTENNA PATTERN]
; Phased-array receiver pattern generator. When this section is present the pattern JSONs
; are (re)generated into Constants.antenna_pattern_folder before [ANTENNA] reads them.
; elements_along_x / elements_along_y: number of array elements per axis (integer >= 1).
elements_along_x    = 3
elements_along_y    = 4
; d_x / d_y: element spacing per axis in METERS (float > 0). Tuned to half-wavelength at GPS L1:
; lambda = c / 1575.42 MHz = 0.19029 m, so lambda/2 = 0.0951 m -- the standard grating-lobe-free
; spacing, and safe for the configured +/-40 deg two-plane scan (d/lambda = 0.5 < ~0.52 scan limit).
; At lower bands (L5/E5a 1176 MHz) d/lambda ~ 0.37, also grating-lobe-free.
d_x                 = 0.0951
d_y                 = 0.0951
; Carrier frequencies are NOT listed here -- they are derived automatically from the carriers of the
; bands selected in [ANTENNA].bands, so a generated pattern always exists for every band (no mismatch).
; Beam steering extent (two-plane scan), each [min_deg, max_deg]. The step count (resolution) lives in
; simulator_settings.yaml (antenna_pattern.along_track_steering_steps / across_track_steering_steps).
; along-track = beam tilt in the flight direction (array x); across-track = tilt perpendicular (array y).
; Signed ranges around boresight (0 deg); include 0 in both. Per-axis max steering = max(|extent|).
; Constraint: sin^2(max_across) + sin^2(max_along) <= 1.
along_track_steering  = [-40, 40]
across_track_steering = [-40, 40]
; Angular resolution (theta_resolution / phi_resolution) is an engine setting; it lives in
; simulator_settings.yaml (antenna_pattern block), not here.

[ANTENNA]
; The pattern folder is fixed in Constants.antenna_pattern_folder (DATA/ANTENNA/antenna_patterns),
; generator-owned when [ANTENNA PATTERN] is present -- keep only current-config pattern files there.
; bands: constellation-specific GNSS signals (list). Allowed (band = carrier MHz):
;   GPS:     L1=1575.42, L2=1227.60, L5=1176.45
;   Galileo: E1=1575.42, E5a=1176.45, E5b=1207.14, E6=1278.75
;   GLONASS: G1=1602.0,  G2=1246.0,  G3=1202.025
;   BeiDou:  B1I=1561.098, B1C=1575.42, B2a=1176.45, B2b=1207.14, B2I=1207.14, B3I=1268.52
; Moving target: each band drives only its own constellation, at its own carrier and EIRP; the link
; budget and all outputs are produced per band (band in the filename).
; Area coverage: coverage is a geometric metric, so the bands only select which constellations
; participate; several bands of one constellation (e.g. L1 and L5) collapse to one result per
; constellation (Coverage_grid_<CONST>.png).
; A band that is unknown (e.g. L33), has no EIRP entry (NavIC and QZSS are not yet wired up), or whose
; constellation is not loaded in [GNSS CONSTELLATIONS] is warned about and skipped -- the run continues.
; The antenna patterns are auto-generated for each selected band's carrier.
bands = ["L1", "E1", "L5", "E5a", "E5b"]
; footprint_db: footprint contour level in dB relative to the normalized pattern peak.
; Must be < 0 (patterns peak at 0 dB). Closer to 0 = tighter footprint.
footprint_db = -0.5

[ORBITS]
; Receiver LEO constellation. One key per satellite: orbit1, orbit2, ... read in order until the
; next is missing. Each = [inclination_deg, eccentricity, raan_deg, argPeriapsis_deg, trueAnomaly_deg,
; semiMajorAxis_m]. Angles in degrees; eccentricity unitless (0 = circular); semi-major axis in
; meters from Earth's center (e.g. 7300e3 m ~ 920 km altitude). At least one orbit is required.
orbit1 = [99.1, 0.00001, 0,    0, 0, 7300e3]
orbit2 = [99.1, 0.00001, 90.0, 0, 0, 7300e3]

[GNSS CONSTELLATIONS]
; gnss_tle_files: TLE files under DATA/TLE_EPHEMIRIS (list). Each filename must contain one of
; GPS, GLONASS, GALILEO, BEIDOU (case-insensitive) to identify its constellation; a filename that
; matches none raises. Only these four constellations are recognized (QZSS/NavIC not yet supported).
gnss_tle_files = [GPS_operational.tle, GALILEO.tle]

[REFLECTION]
; earth_model: surface model for the reflection-point solver. "spherical" uses the closed-form
; quartic on a mean-radius sphere; "elliptical" uses the WGS-84 stationary-path solve. Required.
earth_model = "elliptical"
; reflection_type: "specular" (mirror-point reflections) or "backscatter" (bistatic reflection point).
; Area coverage counts specular-point track visits, or near-backscatter swath visits around the BRP
; track; moving target evaluates the ocean/ship link budget at the specular point or at the BRP.
; Optional; defaults to "specular" if omitted.
reflection_type = "backscatter"
; max_central_angle_deg: finite max Tx-Rx central (Earth-center) angle in (0, 180] deg -- coarse geometric
; filter, applies to both specular and backscatter. Larger = accept more distant geometries.
max_central_angle_deg = 80.0
; max_incidence_angle_deg: finite max incidence angle in (0, 90] deg at the reflection point, measured from
; the local surface normal (0 = normal incidence, 90 = grazing). REQUIRED for backscatter; ignored for
; specular (the mirror condition constrains incidence implicitly).
max_incidence_angle_deg = 45.0

[LINK BUDGET]
; Receiver-system parameters. Losses are fixed (geometry-independent) Rx-side losses in dB (>= 0)
; that lump into the radar-equation loss term L; transmit EIRP is per-(constellation, band) and
; lives in Constants.GNSS_EIRP_DBW, not here. Thermal-noise settings are ideal k*T*B terms at the
; receiver antenna/reference plane. Area coverage uses the link budget only for the antenna
; field-of-view gate; it ignores the noise, detection and delay-Doppler keys.
;   - system_losses_db: lumped implementation loss (feedline/connector, filter insertion, ADC
;     quantization, correlator/processing loss). A catch-all so the budget is not optimistic.
;   - polarization_losses_db: receiver antenna polarization-mismatch loss from finite axial ratio.
;     NOT the RHCP->LHCP handedness flip on reflection (that is in the OceanTarget RCS) -- only the
;     residual antenna-vs-wave mismatch, so the reflection flip is not double-counted here.
;   - noise_bandwidth_hz: thermal-noise bandwidth used when comparing received power against k*T*B.
;   - system_noise_temperature_k: equivalent receiver-system noise temperature at the antenna/reference plane.
;   - detection_sinr_threshold_db: ship detectability threshold for Pr_ship / (Pr_ocean + noise).
;   - ocean_patch_integration_enabled: when true, ocean clutter is integrated patch-by-patch over
;     the steered receiver footprint instead of using a single capped glistening-area scalar.
;   - ocean_patch_grid_size: number of tangent-plane cells per footprint axis for that integration.
;   - delay_doppler_cell_enabled: when true, the distributed ocean-clutter area uses a first-order
;     delay-Doppler Jacobian instead of the antenna footprint. Mutually exclusive with patch integration.
;     At exact specular geometry the first-order map is singular and falls back to the footprint.
;     The detector does not yet verify that a footprint-overlap ship occupies the same DDM bin.
;   - coherent_integration_time_s: coherent integration time T_coh [s]; sets the Doppler-bin width
;     (1 / T_coh) of the cell. Required when delay_doppler_cell_enabled = true. Physically bounded by
;     the navigation-data bit period and the sea-surface decorrelation time (~few ms). Also sets the
;     coherent sensitivity factor B*T_coh used in the threshold metric.
;   - num_incoherent_looks: number of incoherent looks M (>= 1) averaged after each coherent
;     integration; sqrt(M) approximates reduced estimator variation, not lower mean noise power.
system_losses_db = 2.0
polarization_losses_db = 0.5
noise_bandwidth_hz = 2.0e6
system_noise_temperature_k = 290.0
detection_sinr_threshold_db = 0.0
ocean_patch_integration_enabled = false
ocean_patch_grid_size = 9
delay_doppler_cell_enabled = true
coherent_integration_time_s = 0.001
num_incoherent_looks = 1

[OCEAN]
; Sea-state and water-property inputs for the bistatic ocean RCS model. All keys required (floats).
;   - ocean_wave_height_m: significant wave height H_s [m] (>= 0); Rayleigh roughness uses sigma_h ~= H_s/4.
;   - ocean_wind_speed_m_s: wind speed [m/s] (> 0); drives the Cox-Munk slope variances (upwind/crosswind).
;   - ocean_wind_direction_deg: meteorological FROM bearing [deg, 0..360, clockwise from north].
;   - ocean_sea_temperature_c: sea temperature [deg C]; feeds the Klein-Swift seawater permittivity.
;   - ocean_salinity_psu: salinity [PSU]; ~35 for open ocean.
;   - ocean_inverse_wave_age: Omega_c for the Elfouhaily spectrum behind the Bragg backscatter NRCS
;     (0.84 = fully developed sea; up to ~5 for young, growing seas).
ocean_wave_height_m       = 1.5
ocean_wind_speed_m_s      = 7.0
ocean_wind_direction_deg  = 270.0
ocean_sea_temperature_c   = 10.0
ocean_salinity_psu        = 35.0
ocean_inverse_wave_age    = 0.84

[PLOT]
; Moving target only.
; detection_bbox_buffer_deg: padding in degrees around the moving-target bounding box when
; rendering detection plots (float >= 0). Defaults to 2.0 if omitted.
detection_bbox_buffer_deg = 10.0
; Animation (GIF output). create_animation = True|False enables it; the two sub-keys below are
; required only when create_animation = True. Frames are emitted on the native reflection-sample
; grid (= the simulator step size), one per timestamp that has a reflection inside the map extent,
; so the points are shown traveling rather than blinking.
create_animation         = False
; animation_filename: output GIF name written to OUTPUT/.
animation_filename       = Reflection_animation.gif
; animation_fps: playback frames per second (integer > 0).
animation_fps            = 1

[SHIP]
; Moving target only. Physical dimensions of the moving target, above the waterline only -- the
; submerged hull does not contribute to RCS at GNSS L band. All values in meters and must be > 0.
length_m    = 100.0
beam_m      = 15.0
freeboard_m = 5.0
